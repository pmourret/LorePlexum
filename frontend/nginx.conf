# Service des fichiers statiques de la SPA.
#
# nginx ne connaît pas l'API : Traefik route `/api` vers le backend avant
# d'arriver ici. Ce serveur ne fait que deux choses — servir les assets et
# renvoyer index.html pour toute route applicative.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les assets portent un hash dans leur nom (index-CpRSiMBJ.js) : ils sont
    # immuables et peuvent être mis en cache indéfiniment. Un nouveau build
    # produit de nouveaux noms, donc aucune invalidation à gérer.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html, lui, ne doit JAMAIS être mis en cache : c'est lui qui pointe
    # vers les assets hashés. Un index.html périmé sert des assets disparus et
    # l'application devient une page blanche après déploiement.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Routage SPA : `/history`, `/injection/12`… n'existent pas sur le disque.
    # Sans ce repli, un rechargement du navigateur sur une route profonde donne
    # un 404 nginx au lieu de la page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
